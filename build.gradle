plugins {
    id 'java'
    id 'war'
}

group = 'com.kb.youngly'
version = '0.0.1-SNAPSHOT'

ext {
    springVersion         = '5.3.37'
    mybatisVersion        = '3.4.6'
    mybatisSpringVersion  = '1.3.2'
    mysqlVersion          = '8.1.0'
    hikariVersion         = '2.7.4'
    lombokVersion         = '1.18.30'
    log4jVersion          = '2.18.0'
    slf4jVersion          = '1.7.36'
    log4jdbcVersion       = '1.16'
    servletApiVersion     = '4.0.1'
    jacksonVersion        = '2.15.4'
    aspectjVersion        = '1.9.20'
    junitVersion          = '5.9.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

configurations.configureEach {
    resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == 'org.apache.logging.log4j') {
                details.useVersion log4jVersion
            }
        }
        force "org.slf4j:slf4j-api:${slf4jVersion}"
    }
    exclude group: 'log4j', module: 'log4j'
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    exclude group: 'org.slf4j', module: 'slf4j-reload4j'
    exclude group: 'org.slf4j', module: 'slf4j-simple'
    exclude group: 'commons-logging', module: 'commons-logging'
}

dependencies {
    providedCompile "javax.servlet:javax.servlet-api:${servletApiVersion}"

    implementation "org.springframework:spring-context:${springVersion}"
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation "org.springframework:spring-tx:${springVersion}"
    implementation 'javax.inject:javax.inject:1'

    implementation "org.aspectj:aspectjrt:${aspectjVersion}"
    implementation "org.aspectj:aspectjweaver:${aspectjVersion}"

    implementation "org.mybatis:mybatis:${mybatisVersion}"
    implementation "org.mybatis:mybatis-spring:${mybatisSpringVersion}"
    implementation "com.zaxxer:HikariCP:${hikariVersion}"
    implementation "com.mysql:mysql-connector-j:${mysqlVersion}"

    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-slf4j-impl:${log4jVersion}"

    runtimeOnly "org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:${log4jdbcVersion}"

    implementation 'xerces:xercesImpl:2.12.2'

    compileOnly             "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor     "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly         "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation "org.springframework:spring-test:${springVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testImplementation "org.mockito:mockito-core:4.11.0"
    testImplementation "org.mockito:mockito-junit-jupiter:4.11.0"
    testRuntimeOnly    "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'

    implementation "org.springframework.security:spring-security-core:5.8.13"
    implementation "org.springframework.security:spring-security-web:5.8.13"
    implementation "org.springframework.security:spring-security-config:5.8.13"

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.11.5'

    implementation 'io.springfox:springfox-swagger2:2.9.2'
    implementation 'io.springfox:springfox-swagger-ui:2.9.2'

    implementation 'com.google.guava:guava:20.0'

    // implementation "org.springframework:spring-websocket:${springVersion}"
    // implementation "org.springframework:spring-messaging:${springVersion}"

    // implementation 'org.apache.httpcomponents:httpclient:4.5.13'
    // implementation 'org.apache.httpcomponents:httpcore:4.4.15'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

war {
    archiveFileName = 'youngly.war'
}

tasks.register('envCheck') {
    group = 'verification'
    description = 'JDK 17 / Gradle 8.8 환경 점검'
    doLast {
        def jdk = JavaVersion.current()
        def gradleVer = gradle.gradleVersion
        println "Gradle: ${gradleVer} / JDK: ${jdk} / Encoding: ${System.getProperty('file.encoding')}"

        if (gradleVer != '8.8') println "[WARN] Gradle 8.8 권장, 현재 ${gradleVer}"
        if (!jdk.isCompatibleWith(JavaVersion.VERSION_17)) println "[WARN] JDK 17 필요, 현재 ${jdk}"

        def secret = file('src/main/resources/application.properties')
        if (!secret.exists()) {
            println "[WARN] application.properties 없음 (.example 참고)"
        }
    }
}