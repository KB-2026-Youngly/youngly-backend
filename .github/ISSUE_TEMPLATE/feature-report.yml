name: Project 이슈 생성
description: Project Repository에 이슈를 생성하며, 생성된 이슈는 Jira와 연동됩니다.
title: '[Feature] 제목을 입력하세요'
labels:
  - order

body:
  - type: markdown
    attributes:
      value: |
        GitHub 이슈를 생성하면 동일한 제목과 입력 내용을 바탕으로 Jira 이슈가 자동 생성됩니다.

  - type: markdown
    attributes:
      value: |
        ## 📂 Epic 안내

        Jira에서 연결할 상위 Epic을 선택해주세요.

        - ⚙ **Project Setup** : 프로젝트 초기 세팅, 디렉토리 구조, 개발 환경 구축
        - 🔐 **Authentication** : 회원가입, 로그인, 로그아웃, 비밀번호 변경
        - 👤 **User Management** : 회원정보 관리, 계좌 관리, 마이페이지
        - 👥 **Group Management** : 그룹 생성, 가입, 멤버 관리, 그룹 운영
        - 🏆 **Challenge** : 인증, 라운드 진행, 게시글, 정산
        - 🤖 **Recommendation** : AI 추천, 맞춤 추천 기능
        - 🎁 **Reward** : 포인트, 아이템, 보상
        - 🔔 **Notification** : 서비스 알림 및 리마인드

  - type: dropdown
    id: epic
    attributes:
      label: 🎟️ Epic
      description: 작업이 속하는 기능 영역을 선택해주세요.
      options:
        - Project Setup
        - Authentication
        - User Management
        - Group Management
        - Challenge
        - Recommendation
        - Reward
        - Notification
    validations:
      required: true

  - type: dropdown
    id: issue_type
    attributes:
      label: ⚡️ 이슈 유형
      description: 작업 성격에 맞는 Jira Issue Type을 선택해주세요.
      options:
        - Feature
        - Task
        - Bug
        - Chore
    validations:
      required: true

  - type: dropdown
    id: issue_label
    attributes:
      label: 🏷️ 레이블
      description: Jira 이슈 세부 사항에 추가할 레이블을 선택해 주세요.
      multiple: true
      options:
        - backend
        - frontend
        - ai
        - database
        - infrastructure
        - documentation
        - refactor
        - test
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 🌿 Branch Type 안내

        - **feature** : 새로운 기능 개발
        - **fix** : 버그 수정
        - **refactor** : 코드 리팩토링
        - **docs** : 문서 수정
        - **test** : 테스트 코드 작성 및 수정
        - **chore** : 빌드, 설정, 의존성 등 유지보수
        - **ci** : GitHub Actions, CI/CD, 자동화

  - type: dropdown
    id: branch_type
    attributes:
      label: 🌿 브랜치 유형
      description: 작업 성격에 맞는 브랜치 유형을 선택해주세요.
      options:
        - feature
        - fix
        - refactor
        - docs
        - test
        - chore
        - ci
    validations:
      required: true

  - type: input
    id: branch_name
    attributes:
      label: 🌿 브랜치명
      description: develop 브랜치에서 분기해 생성할 브랜치 이름을 입력해 주세요.
      placeholder: login-api
    validations:
      required: true

  - type: textarea
    id: issue_description
    attributes:
      label: 📌 이슈 설명
      description: Jira 이슈 본문에 포함할 작업 내용을 작성해 주세요.
      placeholder: |
        구현 목적과 주요 작업 내용을 작성해 주세요.

        예시:
        - 사용자 로그인 API 구현
        - JWT 액세스 토큰 발급
        - 로그인 실패 예외 처리
    validations:
      required: true
